server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Compresión: el JS y el CSS pesan entre 3 y 8 veces menos en la red
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml image/x-icon font/ttf application/vnd.ms-fontobject;

    # Los archivos del build llevan un hash en el nombre: si cambian, cambia la URL,
    # así que el navegador puede guardarlos un año sin volver a pedirlos.
    # Un archivo inexistente responde 404 (y no index.html, que quedaría cacheado con este nombre).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html siempre se revalida para que cada despliegue nuevo se vea de inmediato
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }
}
